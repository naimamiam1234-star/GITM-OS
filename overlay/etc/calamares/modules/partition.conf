defaultFileSystemType: ext4
availableFileSystemTypes: [ext4, btrfs]
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none
userSwapChoices: [none, small, suspend, file]
initialSwapChoice: file

# Explicit layout prevents affected Calamares builds from accepting an empty
# erase plan. "unknown" follows the filesystem selected in the erase page.
partitionLayout:
  - name: GITM-root
    filesystem: unknown
    mountPoint: /
    size: 100%

efi:
  mountPoint: /boot/efi
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: EFI
