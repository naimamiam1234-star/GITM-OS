---
modules-search: [local]
branding: gitm
prompt-install: true
sequence:
 - show: [welcome, locale, keyboard, partition, users, summary]
 - exec: [partition, mount, shellprocess@gitm-target-check, unpackfs, machineid, fstab, locale, keyboard, localecfg, users, displaymanager, networkcfg, hwclock, services-systemd, shellprocess@gitm-initramfs, bootloader, umount]
 - show: [finished]

instances:
 - id: gitm-target-check
   module: shellprocess
   config: gitm-target-check.conf
 - id: gitm-initramfs
   module: shellprocess
   config: gitm-initramfs.conf
