name: Publish verified Plasma 6 preview
on:
  push:
    branches: [main]
    paths: ['install-validation/**', 'overlay/etc/calamares/**', 'release-tools/**', 'diag-integration/**', 'theme-integration/**', 'plasma-fix/**', 'patches/**', 'plasma-transition/patches/**', '.github/workflows/plasma-fix.yml', '.github/workflows/plasma-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: gitm-plasma-publish
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 'auto'
      RELEASE_TAG: gitm-os-3.3.0-plasma14
    steps:
      - uses: actions/checkout@v4
      - name: Require successful source build
        run: |
          verified=false
          for attempt in $(seq 1 300); do
            if test "$SOURCE_RUN" = auto; then
              if ! resolved=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$GITHUB_SHA" --jq '.workflow_runs | map(select(.name=="Integrate GITM native theme and dock")) | first | .id // empty'); then
                sleep 20; continue
              fi
              if test -z "$resolved"; then sleep 20; continue; fi
              SOURCE_RUN=$resolved
              echo "SOURCE_RUN=$SOURCE_RUN" >> "$GITHUB_ENV"
            fi
            if ! result=$(gh api repos/${{ github.repository }}/actions/runs/$SOURCE_RUN); then
              sleep 20; continue
            fi
            test "$(printf '%s' "$result" | jq -r .head_sha)" = "$GITHUB_SHA"
            status=$(printf '%s' "$result" | jq -r .status)
            if test "$status" = completed; then
              test "$(printf '%s' "$result" | jq -r .conclusion)" = success
              verified=true; break
            fi
            sleep 20
          done
          test "$verified" = true
      - uses: actions/download-artifact@v4
        with:
          name: GITM-Plasma6-preview-amd64
          path: download/iso
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: GITM-Plasma6-gallery
          path: download/gallery
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - name: Validate ISO and guest evidence
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil qemu-system-x86 qemu-utils ovmf xorriso python3-zstandard tesseract-ocr
          python3 release-tools/verify-plasma.py
      - name: Verify actual desktop keyboard input
        run: sudo python3 release-tools/check-keyboard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GITM-Plasma6-input-validation
          path: input-check/
      - name: Verify complete BIOS installation of the final ISO
        run: |
          source=$(find download/iso -type f -name '*.iso' -print -quit)
          test -n "$source"
          bash install-validation/prepare.sh "$source" dist/final-install-bios disk
          sudo python3 install-validation/boot-install.py "$source" --output-root dist/final-install-bios
      - name: Verify complete UEFI installation of the final ISO
        run: |
          source=$(find download/iso -type f -name '*.iso' -print -quit)
          test -n "$source"
          bash install-validation/prepare.sh "$source" dist/final-install-uefi disk
          sudo python3 install-validation/boot-install.py "$source" --uefi --output-root dist/final-install-uefi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GITM-FinalISO-disk-install-validation
          path: |
            dist/final-install-*/*.log
            dist/final-install-*/*.txt
            dist/final-install-*/*.png
            dist/final-install-*/*.json
            dist/final-install-*/*.sha256
            dist/final-install-*/*-guest-evidence.tar.gz
          retention-days: 30
      - name: Package verified preview
        run: |
          mkdir -p release-assets dist
          cp -a download/gallery dist/gallery
          cp input-check/dock-revealed.png dist/gallery/
          python3 release-tools/prepare-gallery.py
          mv download/iso/GITM-OS-3.3.0-integration-amd64.iso release-assets/GITM-OS-Plasma6-amd64.iso
          cd release-assets
          sha256sum GITM-OS-Plasma6-amd64.iso > GITM-OS-Plasma6-amd64.iso.sha256
          split -b 1500M -d -a 2 --numeric-suffixes=1 GITM-OS-Plasma6-amd64.iso GITM-OS-Plasma6-amd64.iso.part
          cp ../dist/gallery.zip GITM-Plasma6-gallery.zip
          cp ../dist/gallery.html ../dist/gallery-overview.png .
          cp ../input-check/keyboard-search.png .
          sha256sum GITM-OS-Plasma6-amd64.iso.part* > parts.sha256
          SOURCE_SHA="$GITHUB_SHA" python3 ../release-tools/manifest-plasma.py
          rm GITM-OS-Plasma6-amd64.iso
      - name: Publish development preview
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease --title 'GITM OS — Validated AutoDiag workspace preview' --notes-file release-tools/plasma-notes.md release-assets/*


