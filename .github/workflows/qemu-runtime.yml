name: Portable GITM QEMU test runtime
on:
  push:
    branches: [stability-install-20261012]
    paths: [install-validation/bundle-runtime.py, .github/workflows/qemu-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install distro VM tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils xorriso squashfs-tools ovmf
      - name: Bundle tools, loader, recursive libraries, modules and firmware
        run: python3 install-validation/bundle-runtime.py
      - name: Check TCG process and loopback QMP startup
        run: |
          python3 - <<'PY'
          import json, pathlib, socket, subprocess, time
          root=pathlib.Path('dist/qemu-runtime').resolve()
          p=subprocess.Popen([str(root/'wrappers/qemu-system-x86_64'),'-machine','q35,accel=tcg','-cpu','max','-m','256','-display','none','-monitor','none','-serial','none','-S','-qmp','tcp:127.0.0.1:4444,server=on,wait=off'],stderr=subprocess.PIPE)
          try:
              for attempt in range(100):
                  if p.poll() is not None: raise RuntimeError(p.stderr.read().decode())
                  try: s=socket.create_connection(('127.0.0.1',4444),timeout=1); break
                  except OSError: time.sleep(.1)
              else: raise RuntimeError('QMP loopback did not open')
              f=s.makefile('rwb',buffering=0)
              greeting=f.readline().decode()
              f.write(b'{"execute":"qmp_capabilities"}\n')
              response=f.readline().decode()
              assert 'return' in json.loads(response),response
              (root/'qmp-loopback-check.txt').write_text(greeting+response)
          finally:
              p.terminate()
              try: p.wait(timeout=5)
              except subprocess.TimeoutExpired: p.kill(); p.wait()
          PY
      - name: Preserve executable permissions in transport
        run: tar -C dist -czf dist/GITM-QEMU-runtime.tar.gz qemu-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: GITM-QEMU-runtime
          path: dist/GITM-QEMU-runtime.tar.gz
          compression-level: 0
          retention-days: 14
