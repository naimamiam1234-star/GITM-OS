name: GITM actual installed system update test
on:
  push:
    branches: [update-test-20261012]
    paths: ['update-validation/**', '.github/workflows/update-test.yml']
  workflow_dispatch:
    inputs:
      source_run:
        description: Source ISO artifact run (source13)
        default: '38286238342'
        required: true
      boot_mode:
        description: Firmware mode for fresh disk installation
        type: choice
        options: [UEFI, BIOS]
        default: UEFI
        required: true
permissions:
  contents: read
  actions: read
jobs:
  disk-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GITM-Plasma6-preview-amd64
          run-id: ${{ inputs.source_run || '38286238342' }}
          github-token: ${{ github.token }}
          path: input
      - name: Install VM tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils xorriso python3-pil python3-zstandard ovmf
      - name: Prepare ephemeral candidate configuration and helper
        run: |
          source=$(find input -type f -name '*.iso' -print -quit)
          test -n "$source"
          python3 update-validation/prepare.py "$source"
      - name: Install to fresh 40GiB disk and boot without ISO
        env:
          BOOT_MODE: ${{ inputs.boot_mode || 'UEFI' }}
        run: |
          source=$(find input -type f -name '*.iso' -print -quit)
          firmware=()
          case "$BOOT_MODE" in
            UEFI) firmware=(--uefi) ;;
            BIOS) ;;
            *) echo "Unsupported boot mode: $BOOT_MODE" >&2; exit 1 ;;
          esac
          sudo python3 update-validation/boot-update.py "$source" "${firmware[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GITM-installed-update-evidence
          path: |
            dist/disk-install/*.log
            dist/disk-install/*.txt
            dist/disk-install/*.png
            dist/disk-install/*.json
            dist/disk-install/*.sha256
            dist/disk-install/*-guest-evidence.tar.gz
          retention-days: 14
