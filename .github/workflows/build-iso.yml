name: Build GITM development ISO
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'patches/**', 'overlay/**', '.github/workflows/build-iso.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gitm-iso-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ubuntu-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check build privileges and capacity
        run: |
          sudo chroot / /bin/true
          df -h / /var/tmp
      - name: Build desktop foundation
        run: sudo bash scripts/build-iso.sh
      - name: Boot BIOS and UEFI virtual machines
        run: sudo python3 scripts/boot-smoke.py
      - name: Upload single ISO and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GITM-OS-3.3-integration-amd64
          path: dist/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Upload boot diagnostics separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GITM-boot-diagnostics
          path: |
            dist/*.png
            dist/*.log
            dist/*.txt
            dist/*.sha256
          retention-days: 14
