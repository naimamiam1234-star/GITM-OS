name: Publish boot-tested ISO parts
on:
  push:
    paths: ['distribution/**', '.github/workflows/publish-iso.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GITM-OS-3.3-repaired
          run-id: 37999565072
          github-token: ${{ github.token }}
          path: dist
      - run: python3 -m py_compile distribution/prepare-release.py && python3 distribution/prepare-release.py
      - name: Publish checksum-verified boot-tested image
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create gitm-os-3.3.0-preview dist/*.part-* dist/*.sha256 dist/Join-ISO-Windows.cmd dist/release-manifest.json dist/desktop-smoke.png dist/qt-smoke.png dist/split-smoke.png dist/bios.png dist/uefi.png --prerelease --title "GITM OS 3.3 boot-tested preview" --notes-file docs/release-3.3.md --target ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-manifest
          path: dist/release-manifest.json
