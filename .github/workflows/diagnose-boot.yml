name: Diagnose live boot
on:
  push:
    paths: ['debug-tools/**', '.github/workflows/diagnose-boot.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GITM-OS-3.3-integration-amd64
          run-id: 37996329268
          github-token: ${{ github.token }}
          path: dist
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - run: python3 debug-tools/boot-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-probe
          path: probe/*.log
