name: GITM 3.4.0 brand and resources installed update
on:
  push:
    branches: [autodiag-expansion-20261012]
    paths: ['diag-integration/**', 'application-update/**', 'branding-update/**', '.github/workflows/application-update.yml']
  workflow_dispatch:
    inputs:
      source_run:
        description: Verified base ISO artifact run
        default: '38286238342'
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: gitm-autodiag-application-${{ github.sha }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GITM-AutoDiag-3.4.0-debian-candidate
          run-id: '38441081505'
          github-token: ${{ github.token }}
          path: input
      - name: Verify public resource service
        run: |
          curl --fail --retry 6 --retry-delay 10 https://gitm-branding-preview.naimamiam1234.workers.dev/manifest.json -o /tmp/portal.json
          python3 -c "import json; j=json.load(open('/tmp/portal.json')); assert j['version']=='3.4.0' and len(j['assets'])==22"
      - name: Build application-only candidate from SHA-pinned existing package
        run: |
          source=$(find input -type f -name 'gitm-autodiag_3.4.0-3_all.deb' -print -quit)
          python3 application-update/build.py "$source"
          python3 - <<'PY'
          import pathlib,hashlib,shutil
          expected={'gitm-sdk-sources_2026.10.13-1_all.deb':'9c6c2b171bb047868ac704eba5eaa9f734631b5a8962df71be4084a9062d7959','gitm-obdb-data_2026.10.13-1_all.deb':'e9175c5db69cfaac0899e7d7a1a638a139c826d61be79e4e50092f801e8ef49f'}
          for name,digest in expected.items():
              source=pathlib.Path('input')/name
              assert hashlib.sha256(source.read_bytes()).hexdigest()==digest
              shutil.copy2(source,pathlib.Path('dist/app-update')/name)
          shutil.copy2('input/resource-manifest.json','dist/app-update/resource-manifest.json')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GITM-AutoDiag-3.4.0-debian-candidate
          path: dist/app-update/*
          retention-days: 30

  disk-install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        boot_mode: [UEFI, BIOS]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GITM-Plasma6-preview-amd64
          run-id: ${{ inputs.source_run || '38286238342' }}
          github-token: ${{ github.token }}
          path: input
      - uses: actions/download-artifact@v4
        with:
          name: GITM-AutoDiag-3.4.0-debian-candidate
          path: dist/app-update
      - name: Install VM tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils xorriso squashfs-tools python3-pil python3-zstandard ovmf
      - name: Prepare actual candidate installation test
        run: |
          source=$(find input -type f -name '*.iso' -print -quit)
          test -n "$source"
          python3 application-update/prepare-test.py "$source" dist/app-update/gitm-autodiag_3.5.0~preview1_all.deb dist/app-update/gitm-sdk-sources_2026.10.13-1_all.deb dist/app-update/gitm-obdb-data_2026.10.13-1_all.deb
      - name: Install to fresh 40GiB disk and boot without ISO
        env:
          BOOT_MODE: ${{ matrix.boot_mode }}
        run: |
          source=$(find input -type f -name '*.iso' -print -quit)
          firmware=()
          case "$BOOT_MODE" in
            UEFI) firmware=(--uefi) ;;
            BIOS) ;;
            *) echo "Unsupported boot mode: $BOOT_MODE" >&2; exit 1 ;;
          esac
          sudo python3 update-validation/boot-update.py "$source" "${firmware[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GITM-AutoDiag-3.4.0-${{ matrix.boot_mode }}-installed-evidence
          path: |
            dist/disk-install/*.log
            dist/disk-install/*.txt
            dist/disk-install/*.png
            dist/disk-install/*.json
            dist/disk-install/*.sha256
            dist/disk-install/*-guest-evidence.tar.gz
          retention-days: 14


