name: Publish status-bar fixed ISO
on:
  workflow_run:
    workflows: ["Build GITM development ISO"]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == 'b65b17820e47152426d6bdfdba5295fe476a843e' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GITM-OS-3.3-integration-amd64
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Verify and split the boot-tested ISO
        env:
          BOOT_TEST_RUN: ${{ github.event.workflow_run.id }}
        run: python3 release/prepare-status.py
      - name: Publish immutable corrected image
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create gitm-os-3.3.0-statusfix1 dist/*.part-* dist/*.sha256 dist/Join-ISO-Windows.cmd dist/release-manifest.json dist/desktop-smoke.png dist/bios.png dist/uefi.png --prerelease --title "GITM OS 3.3 — connectivity and control-center fix" --notes-file docs/status-fix.md --target ${{ github.event.workflow_run.head_sha }}
