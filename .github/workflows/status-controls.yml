name: Verify desktop status controls
on:
  push:
    paths: ['patches/gitm_desktop.py','patches/desktop_radios.py','patches/desktop-assets/**','scripts/check-status.py','.github/workflows/status-controls.yml']
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
          python3 -m venv /tmp/status-venv
          /tmp/status-venv/bin/pip install PySide6==6.8.3
          mkdir -p patches/assets/desktop
          cp patches/desktop-assets/*.svg patches/assets/desktop/
      - name: Verify interaction and measured-state parsing
        run: /tmp/status-venv/bin/python scripts/check-status.py
      - uses: actions/upload-artifact@v4
        with:
          name: status-controls-preview
          path: dist/*.png
