name: GITM installer startup evidence
on:
  push:
    branches: [stability-install-20261012]
    paths: [install-validation/**, .github/workflows/installer-probe.yml]
  workflow_dispatch:
    inputs:
      source_run:
        description: Known ISO artifact run
        default: '38190430931'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GITM-Plasma6-preview-amd64
          run-id: ${{ inputs.source_run || '38190430931' }}
          github-token: ${{ github.token }}
          path: input
      - name: Install virtual machine tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils xorriso cpio python3-pil
      - name: Prepare test-only appended initramfs
        run: |
          source=$(find input -type f -name '*.iso' -print -quit)
          test -n "$source"
          bash install-validation/prepare.sh "$source"
      - name: Non-writing launcher and root debug startup probe
        run: |
          source=$(find input -type f -name '*.iso' -print -quit)
          sudo python3 install-validation/boot-probe.py "$source"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GITM-installer-startup-evidence
          path: |
            dist/install-probe/*.log
            dist/install-probe/*.txt
            dist/install-probe/*.png
            dist/install-probe/*.json
            dist/install-probe/*.sha256
            dist/install-probe/guest-evidence.tar.gz
          retention-days: 14
