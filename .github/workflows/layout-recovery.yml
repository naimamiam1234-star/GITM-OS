name: Verify final desktop gallery
on:
  push:
    paths: ['layout-recovery/**', '.github/workflows/layout-recovery.yml']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GITM-OS-3.3-integration-amd64
          run-id: 38009212923
          github-token: ${{ github.token }}
          path: dist
      - name: Install capture and repack tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools qemu-system-x86 ovmf python3-pil
      - name: Correct capture automation in the existing ISO
        run: sudo bash layout-recovery/repack.sh
      - name: Boot BIOS/UEFI and open the actual applications
        run: sudo env GITM_GALLERY=1 python3 scripts/boot-smoke.py
      - name: Check the complete gallery
        run: python3 release/prepare-gallery.py
      - name: Verify and split the final image
        env:
          BOOT_TEST_RUN: ${{ github.run_id }}
        run: python3 release/prepare-status.py
      - name: Publish final boot-tested image and gallery
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create gitm-os-3.3.0-layoutfix1 dist/*.part-* dist/*.sha256 dist/Join-ISO-Windows.cmd dist/release-manifest.json dist/desktop-smoke.png dist/bios.png dist/uefi.png dist/gallery.html dist/gallery.zip dist/gallery-overview.png --prerelease --title "GITM OS 3.3 — desktop layout correction and actual application gallery" --notes-file docs/layout-fix.md --target ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-gallery-diagnostics
          path: |
            dist/gallery/
            dist/gallery-overview.png
            dist/release-manifest.json
            dist/*.log
            dist/bios.png
            dist/uefi.png
          retention-days: 90
