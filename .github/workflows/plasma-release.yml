name: Publish verified Plasma 6 preview
on:
  push:
    branches: [main]
    paths: ['release-tools/**', 'diag-integration/**', 'theme-integration/**', 'plasma-fix/**', 'patches/**', 'plasma-transition/patches/**', '.github/workflows/plasma-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: gitm-plasma-publish
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 'auto'
      RELEASE_TAG: gitm-os-3.3.0-plasma13
    steps:
      - uses: actions/checkout@v4
      - name: Require successful source build
        run: |
          for attempt in $(seq 1 120); do
            if test "$SOURCE_RUN" = auto; then
              resolved=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$GITHUB_SHA" --jq '.workflow_runs[] | select(.name=="Integrate GITM native theme and dock") | .id' | head -n1)
              if test -z "$resolved"; then sleep 20; continue; fi
              SOURCE_RUN=$resolved
              echo "SOURCE_RUN=$SOURCE_RUN" >> "$GITHUB_ENV"
            fi
            status=$(gh api repos/${{ github.repository }}/actions/runs/$SOURCE_RUN --jq .status)
            test "$status" = completed && break
            sleep 20
          done
          test "$(gh api repos/${{ github.repository }}/actions/runs/$SOURCE_RUN --jq .conclusion)" = success
      - uses: actions/download-artifact@v4
        with:
          name: GITM-Plasma6-preview-amd64
          path: download/iso
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: GITM-Plasma6-gallery
          path: download/gallery
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - name: Validate ISO and guest evidence
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil qemu-system-x86 tesseract-ocr
          python3 release-tools/verify-plasma.py
      - name: Verify actual desktop keyboard input
        run: sudo python3 release-tools/check-keyboard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GITM-Plasma6-input-validation
          path: input-check/
      - name: Package verified preview
        run: |
          mkdir release-assets dist
          cp -a download/gallery dist/gallery
          cp input-check/dock-revealed.png dist/gallery/
          python3 release-tools/prepare-gallery.py
          mv download/iso/GITM-OS-3.3.0-integration-amd64.iso release-assets/GITM-OS-Plasma6-amd64.iso
          cd release-assets
          sha256sum GITM-OS-Plasma6-amd64.iso > GITM-OS-Plasma6-amd64.iso.sha256
          split -b 1500M -d -a 2 --numeric-suffixes=1 GITM-OS-Plasma6-amd64.iso GITM-OS-Plasma6-amd64.iso.part
          cp ../dist/gallery.zip GITM-Plasma6-gallery.zip
          cp ../dist/gallery.html ../dist/gallery-overview.png .
          cp ../input-check/keyboard-search.png .
          sha256sum GITM-OS-Plasma6-amd64.iso.part* > parts.sha256
          SOURCE_SHA=$(gh api repos/${{ github.repository }}/actions/runs/$SOURCE_RUN --jq .head_sha) python3 ../release-tools/manifest-plasma.py
          rm GITM-OS-Plasma6-amd64.iso
      - name: Publish development preview
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease --title 'GITM OS — Validated AutoDiag workspace preview' --notes-file release-tools/plasma-notes.md release-assets/*


